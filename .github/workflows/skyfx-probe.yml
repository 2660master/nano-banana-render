# TEMPORARY (round 3): prints API signatures from the 1.21.11 Mojang-mapped sources so the mod can be written against them.
name: SkyFX API probe

on:
  push:
    paths:
      - '.github/workflows/skyfx-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: skyfx-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - name: gen sources
        run: ./gradlew genSources --stacktrace -q
      - name: extract
        run: |
          mkdir -p /tmp/mcsrc
          find ~/.gradle .gradle -name "*minecraft*sources.jar" 2>/dev/null | tee /tmp/jars.txt
          for j in $(cat /tmp/jars.txt); do unzip -qo "$j" -d /tmp/mcsrc; done
          find ~/.gradle -path "*fabric-api*" -name "*fabric-rendering-v1*sources*.jar" | head -3
      - name: probe
        run: |
          cat > /tmp/probe.py <<'EOF'
          import os, re, sys
          ROOT = '/tmp/mcsrc'
          DECL = re.compile(r'\b(class|interface|enum|record)\b')
          def find(path):
              p = os.path.join(ROOT, path)
              if os.path.exists(p): return p
              base = os.path.basename(path)
              hits = []
              for d, _, fs in os.walk(ROOT):
                  if base in fs: hits.append(os.path.join(d, base))
              print('!! missing', path, 'candidates:', [h[len(ROOT)+1:] for h in hits])
              return hits[0] if len(hits) == 1 else None
          CLS = re.compile(r'\b(class|interface|enum|record)\s+\w+')
          def sig(lines):
              stack = []
              out = []
              for ln in lines:
                  s = ln.strip()
                  top = stack[-1] if stack else 'class'
                  if top == 'class' and s and not s.startswith(('//', 'import', 'package')) and s not in ('}', '};'):
                      out.append(ln.rstrip())
                  head = s.split('{')[0]
                  kind = 'class' if (CLS.search(head) and '=' not in head and 'new ' not in head) else 'block'
                  for ch in s:
                      if ch == '{': stack.append(kind); kind = 'block'
                      elif ch == '}' and stack: stack.pop()
              return out
          def method(lines, name):
              out = []
              i = 0
              pat = re.compile(r'\b' + re.escape(name) + r'\s*\(')
              while i < len(lines):
                  ln = lines[i]
                  if pat.search(ln) and not ln.strip().startswith(('return', '//')) and (ln.rstrip().endswith('{') or ln.rstrip().endswith(',')) and re.match(r'^\s*(public|private|protected|static|final|abstract|synchronized|default|<|void|[A-Z])', ln):
                      depth = 0; started = False
                      while i < len(lines):
                          out.append(lines[i].rstrip())
                          depth += lines[i].count('{') - lines[i].count('}')
                          if '{' in lines[i]: started = True
                          i += 1
                          if started and depth <= 0: break
                      out.append('')
                  else:
                      i += 1
              return out
          for spec in open('/tmp/specs.txt'):
              spec = spec.strip()
              if not spec or spec.startswith('#'): continue
              parts = spec.split(' ', 2)
              mode, path = parts[0], parts[1]
              arg = parts[2] if len(parts) > 2 else None
              print('\n######## %s %s %s' % (mode, path, arg or ''))
              if mode == 'ls':
                  d = os.path.join(ROOT, path)
                  print(sorted(os.listdir(d)) if os.path.isdir(d) else '!! no dir')
                  continue
              f = find(path)
              if not f: continue
              lines = open(f, encoding='utf-8').read().split('\n')
              if mode == 'full': res = lines
              elif mode == 'sig': res = sig(lines)
              elif mode == 'method': res = method(lines, arg)
              elif mode == 'grep': res = ['%d: %s' % (n+1, l.rstrip()) for n, l in enumerate(lines) if re.search(arg, l)]
              elif mode == 'lines':
                  a, b = [int(x) for x in arg.split('-')]
                  res = ['%d: %s' % (n, lines[n-1].rstrip()) for n in range(a, min(b, len(lines)) + 1)]
              print('\n'.join(res))
          EOF
          cat > /tmp/specs.txt <<'EOF'
          grep net/minecraft/client/renderer/GameRenderer.java renderItemInHand|itemInHandRenderer|renderHandsWithItems|outputColorTextureOverride|featureRenderDispatcher|submitNodeStorage|renderAllFeatures
          method net/minecraft/client/renderer/GameRenderer.java renderItemInHand
          ls net/minecraft/client/gui/render/pip
          method net/minecraft/client/gui/render/pip/PictureInPictureRenderer.java prepare
          method net/minecraft/client/gui/render/pip/PictureInPictureRenderer.java prepareTexturesAndProjection
          grep com/mojang/blaze3d/systems/RenderSystem.java outputColorTextureOverride|outputDepthTextureOverride
          grep net/minecraft/client/renderer/rendertype/OutputTarget.java .
          sig com/mojang/blaze3d/systems/SamplerCache.java
          sig com/mojang/blaze3d/pipeline/TextureTarget.java
          sig com/mojang/blaze3d/textures/FilterMode.java
          sig com/mojang/blaze3d/textures/AddressMode.java
          lines net/minecraft/client/renderer/RenderPipelines.java 686-725
          method net/minecraft/client/renderer/PostPass.java addToFrame
          grep net/minecraft/client/renderer/rendertype/RenderType.java public
          sig net/minecraft/client/renderer/rendertype/RenderSetup.java
          grep net/minecraft/client/renderer/ItemInHandRenderer.java public void|private void render
          grep net/minecraft/client/renderer/feature/FeatureRenderDispatcher.java public
          grep net/minecraft/client/renderer/SubmitNodeStorage.java public
          grep com/mojang/blaze3d/vertex/VertexFormat.java uploadImmediate
          EOF
          python3 /tmp/probe.py
