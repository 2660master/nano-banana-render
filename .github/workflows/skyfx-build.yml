# Builds the SkyFX Fabric mod (skyfx-mod/) and uploads the jar as a workflow artifact.
name: SkyFX mod build

on:
  push:
    paths:
      - 'skyfx-mod/**'
      - '.github/workflows/skyfx-build.yml'
  pull_request:
    paths:
      - 'skyfx-mod/**'
      - '.github/workflows/skyfx-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: skyfx-mod
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace
      - name: upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: skyfx-mod-jar
          path: skyfx-mod/build/libs/
