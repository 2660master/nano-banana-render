<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">
        <span class="logo">D</span>
        <span>Demo Catalog <small>voorbeeld-inhoud</small></span>
      </a>
      <div class="header-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="search" type="search" placeholder="Zoek op naam, tag of auteur…" autocomplete="off" />
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Ontdek tools & resources</h1>
      <p>Een schone, lokaal te draaien voorbeeldcatalogus. Blader door de items, filter op categorie of zoek gericht. Alle inhoud is fictief en volledig legaal.</p>
    </section>

    <div id="filters" class="filters"></div>
    <div id="grid" class="grid"></div>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
